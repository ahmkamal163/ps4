    <title>AHMED KAMAL PS4 - Cache Installation</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<!-- Header Section -->
<header class="top-header">
    <div>
        <h1 class="glow-title">AHMED KAMAL PS4</h1>
        <h2>GoldHEN Environment</h2>
        <h3>Offline Cache Installer</h3>
    </div>
</header>

<!-- Main Grid Layout -->
<main class="main-layout">
    <img src="bleach.png" alt="Bleach Image" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block;" onerror="this.style.display='none'">

    <!-- Center Terminal Console Window -->
    <div class="card console-box">
        <div class="console-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span class="console-title">SYSTEM OUTPUT</span>
        </div>
        <pre id="console">Loading GoldHEN v2.4b18.10... Please Wait</pre>
    </div>

    <!-- Right Controller / Info Box -->
    <div class="card controller-box">
        <img src="logo.png" alt="Custom Image" style="width: 100%; max-width: 160px; height: auto; border-radius: 8px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6));" onerror="this.style.display='none'">
        <span class="controller-status">WDSTORE HOST</span>
        <span class="phone-number">Active</span>
    </div>

</main>

<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";};
</script>
