<!DOCTYPE html>
<html lang="en" manifest="css.manifest">
<head>
<meta charset="UTF-8">
<title>AHMED KAMAL PS4 - CSS Cache</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<!-- Header Section -->
<header class="top-header">
    <div>
        <h1 class="glow-title">AHMED KAMAL PS4</h1>
        <h2>GoldHEN Environment</h2>
        <h3>PlayStation 4 Exploit Host</h3>
    </div>
</header>

<!-- Main Grid Layout -->
<main class="main-layout">
    
    <!-- Hero Image -->
    <img src="bleach.png" alt="Bleach Image" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block;" onerror="this.style.display='none'">

    <!-- Center Terminal Console Window -->
    <div class="card console-box">
        <div class="console-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span class="console-title">CACHE INSTALLER</span>
        </div>
        <pre id="console">Starting Cache Installation...</pre>
    </div>

    <!-- Right Controller / Info Box -->
    <div class="card controller-box">
        <img src="logo.png" alt="Custom Image" style="width: 100%; max-width: 160px; height: auto; border-radius: 8px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6));" onerror="this.style.display='none'">
        <span class="controller-status">WDSTORE HOST</span>
        <span class="phone-number">Active</span>
    </div>

</main>

<script>
// Clear history stack safely
try {
    history.replaceState(null, null, 'index.html');
    if (history.length > 1) {
        history.go(-history.length);
    }
} catch (e) {}

// Output Helper Function
function logConsole(msg) {
    var consoleEl = document.getElementById('console');
    if (consoleEl) {
        consoleEl.innerHTML = msg;
    }
}

function DLProgress(e) {
    if (e && e.total) {
        var percent = Math.round((e.loaded / e.total) * 100);
        logConsole("Installing Offline Cache: " + percent + "%");
    } else {
        logConsole("Installing Offline Cache...");
    }
}

function DisplayCacheProgress() {
    logConsole("Cache Installed Successfully ✔");
    setTimeout(function() {
        logConsole("Now Close And Re-Open Your Browser ...");
    }, 1500);
}

// Attach AppCache listeners safely
if (window.applicationCache) {
    var appCache = window.applicationCache;
    appCache.addEventListener("progress", DLProgress, false);
    appCache.addEventListener("cached", DisplayCacheProgress, false);
    appCache.addEventListener("updateready", DisplayCacheProgress, false);
    appCache.addEventListener("error", function(e) {
        logConsole("Error Installing Cache! - Clear and Re-Open Your Browser ...");
    }, false);
} else {
    logConsole("AppCache API is not supported in this browser environment.");
}
</script>

</body>
</html>
