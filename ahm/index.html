<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AHMED KAMAL PS4</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function getConsole() {
    return document.getElementById('console');
}

function onScriptError() {
    var consoleEl = getConsole();
    if (consoleEl) {
        consoleEl.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
    }
}

function injectScript(src, isModule, onLoadCallback) {
    var script = document.createElement('script');
    if (isModule) script.type = 'module';
    script.src = src;
    script.onerror = onScriptError;
    if (onLoadCallback) script.onload = onLoadCallback;
    document.head.appendChild(script);
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        var consoleEl = getConsole();
        if (consoleEl) {
            consoleEl.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 13.00";
        }
    });
} else {
    var appCacheStatus = (window.applicationCache) ? window.applicationCache.status : -1;

    // Direct redirects since installer files sit in the same ahm/ folder
    if (appCacheStatus === 0 || appCacheStatus === -1) {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                var consoleEl = getConsole();
                if (consoleEl) {
                    consoleEl.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
                }
            });
        }
    } else {
        // Direct payload script injection relative to ahm/
        document.addEventListener("DOMContentLoaded", () => {
            if (fwNum == 5.05 || fwNum == 5.07) {
                injectScript("505/exploit.js", false);
            }
            else if (fwNum >= 7.00 && fwNum <= 8.52) {
                injectScript("700/alert.js", true);
            }
            else if (fwNum >= 9.00 && fwNum <= 9.60) {
                injectScript("900/alert.js", true);
            }
            else if (fwNum >= 10.00 && fwNum <= 11.02) {
                injectScript("css/main.js", false, function () {
                    setTimeout(function () {
                        if (typeof doJb === "function") doJb();
                    }, 500);
                });
            }
            else if (fwNum >= 11.50 && fwNum <= 12.02) {
                injectScript("slopkit/chain_lapse.js", true);
            }
            else if (fwNum >= 12.50 && fwNum <= 13.00) {
                injectScript("slopkit/chain_poops.js", true);
            }
        });
    }
}
</script>

<header class="top-header">
    <div>
        <h1 class="glow-title">AHMED KAMAL PS4</h1>
        <h2>GoldHEN Environment</h2>
        <h3>PlayStation 4 Exploit Host</h3>
    </div>
</header>

<main class="main-layout">
    <img src="bleach.png" alt="Bleach Image" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block;" onerror="this.style.display='none'">

    <div class="card console-box">
        <div class="console-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span class="console-title">SYSTEM OUTPUT</span>
        </div>
        <pre id="console">Loading GoldHEN v2.4b18.10... Please Wait</pre>
    </div>

    <div class="">
        <img src="logo.png" alt="Custom Image" style="width: 100%; max-width: 160px; height: auto; border-radius: 8px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6));" onerror="this.style.display='none'">
        <span class="controller-status">WDSTORE HOST</span>
        <span class="phone-number">Active</span>
    </div>
</main>

</body>
</html>
