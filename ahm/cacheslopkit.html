<!DOCTYPE html>
<html lang="en" manifest="slopkit.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHMED KAMAL PS4 - Cache Installation (FW 11.50-13.00)</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<!-- Header Section -->
<header class="top-header">
    <div>
        <h1 class="glow-title">AHMED KAMAL PS4</h1>
        <h2>GoldHEN / Slopkit Environment</h2>
        <h3>FW 11.50 - 13.00 Offline Cache Installer</h3>
    </div>
</header>

<!-- Main Grid Layout -->
<main class="main-layout">
    
    <!-- Hero Image Slot -->
    <div class="image-wrapper">
        <img src="bleach.png" alt="Bleach Theme" class="hero-img" onerror="this.style.display='none'">
    </div>

    <!-- Center Terminal Console Window -->
    <div class="card console-box">
        <div class="console-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span class="console-title">CACHE INSTALLER OUTPUT</span>
        </div>
        <pre id="console">Initializing Slopkit Cache Installer...</pre>
    </div>

    <!-- Right Controller / Info Box -->
    <div class="card controller-box">
        <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <span class="controller-status">WDSTORE HOST</span>
        <span class="phone-number" style="color: #f31414;">Offline Mode</span>
    </div>

</main>

<script>
// Rewrite address bar to sibling index.html (same directory)
try {
    history.replaceState(null, null, 'index.html');
    if (history.length > 1) {
        history.go(-history.length);
    }
} catch (e) {
    console.warn("History rewrite blocked:", e);
}

// Target UI output element
function logStatus(msg) {
    var consoleEl = document.getElementById('console');
    if (consoleEl) {
        consoleEl.innerHTML = msg;
    }
}

// Calculate and render download progress (0% to 100%)
function DLProgress(e) {
    if (e && e.lengthComputable && e.total) {
        var percent = Math.round((e.loaded / e.total) * 100);
        logStatus("Installing Offline Cache: <span style='color: #00ff00;'>" + percent + "%</span>");
    } else if (e && e.loaded && e.total) {
        var percent = Math.round((e.loaded / e.total) * 100);
        logStatus("Installing Offline Cache: <span style='color: #00ff00;'>" + percent + "%</span>");
    } else {
        logStatus("Installing Offline Cache...");
    }
}

// Executed when all files in slopkit.manifest are successfully downloaded
function DisplayCacheProgress() {
    logStatus("Slopkit Cache Installed Successfully ✔");
    setTimeout(function() {
        logStatus("Now Close Browser & Re-Open Offline!");
    }, 2000);
}

// Attach HTML5 ApplicationCache Event Listeners
if (window.applicationCache) {
    var appCache = window.applicationCache;

    // Triggered as each file listed in slopkit.manifest finishes downloading
    appCache.addEventListener("progress", DLProgress, false);

    // Triggered when caching completes for the first time
    appCache.addEventListener("cached", DisplayCacheProgress, false);

    // Triggered when an updated manifest finishes downloading
    appCache.addEventListener("updateready", DisplayCacheProgress, false);

    // Triggered if any file in slopkit.manifest returns a 404 error
    appCache.addEventListener("error", function(e) {
        logStatus("<span style='color: #ff3333;'>Error Installing Cache!</span><br>Check slopkit.manifest for 404 missing files.");
    }, false);

    // Triggered when download process begins
    appCache.addEventListener("downloading", function() {
        logStatus("Downloading Manifest Files... <span style='color: #00ff00;'>0%</span>");
    }, false);
} else {
    logStatus("Error: AppCache API is not supported on this browser.");
}
</script>

</body>
</html>
