<!DOCTYPE html>
<html lang="en" manifest="900.manifest">
<head>
<meta charset="UTF-8">
<title>AHMED KAMAL PS4 - Cache Installation</title>
<link rel="stylesheet" href="../style.css">
<script>
        if (window.applicationCache) {
            window.applicationCache.addEventListener('cached', function() {
                alert('Cache Installed Successfully!');
                window.location.href = "index.html";
            });
            window.applicationCache.addEventListener('noupdate', function() {
                window.location.href = "index.html";
            });
        }
    </script>
</head>
<body>

<!-- Header Section -->
<header class="top-header">
    <div>
        <h1 class="glow-title">AHMED KAMAL PS4</h1>
        <h2>GoldHEN Environment</h2>
        <h3>Offline Cache Installer</h3>
    </div>
</header>

<!-- Main Grid Layout -->
<main class="main-layout">
    
    <!-- Raw Image -->
    <img src="../ahm/bleach.png" alt="Bleach Image" style="width: 120%; height: 100%; object-fit: cover; border-radius: 12px; display: block;" onerror="this.style.display='none'">

    <!-- Center Terminal Console Window -->
    <div class="card console-box">
        <div class="console-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span class="console-title">CACHE INSTALLER OUTPUT</span>
        </div>
        <pre id="console">Starting Cache Installation...</pre>
    </div>

    <!-- Right Controller / Info Box with Image Slot -->
    <div class="card controller-box">
        <img src="../ahm/logo.png" alt="Custom Image" style="width: 100%; max-width: 160px; height: auto; border-radius: 8px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6));" onerror="this.style.display='none'">
        
        <span class="controller-status">WDSTORE HOST</span>
        <span class="phone-number" style="color: #f31414;">Offline Mode</span>
    </div>

</main>

</body>
</html>
